name: Liquidity Nexus CI & Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
permissions:
  contents: write
  actions: read
jobs:
  backend:
    if: github.event_name != 'schedule'
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          health = client.get("/health")
          assert health.status_code == 200, health.text
          assert health.json()["mode"] == "SIGNAL_ONLY"
          instruments = client.get("/api/v1/instruments")
          assert instruments.status_code == 200
          assert instruments.json()["total"] >= 20
          print("Backend API smoke tests passed")
          PY
      - name: Production API and private Blob persistence smoke test
        run: |
          echo "Checking public production endpoints with Vercel Authentication limited to previews"
          curl --location --fail --silent --show-error --retry 3 --max-time 30 \
            "https://liquidity-nexus-api-agus-902e.vercel.app/api/v1/storage/health" -o storage-health.json
          python -c "import json; d=json.load(open('storage-health.json')); assert d['available'] is True, d"
          SCAN_STATUS=$(curl --location --post301 --post302 --post303 --silent --show-error --retry 2 --max-time 90 \
            --write-out "%{http_code}" -D scan-headers.txt \
            -X POST "https://liquidity-nexus-api-agus-902e.vercel.app/api/v1/scan" \
            -H "Content-Type: application/json" \
            -d '{"symbols":["EURUSD"],"timeframe":"15M"}' -o scan-results.json)
          echo "Production scan HTTP status: $SCAN_STATUS"
          cat scan-headers.txt
          test "$SCAN_STATUS" = "200" || test "$SCAN_STATUS" = "204"
          if [ -s scan-results.json ]; then
            python -c "import json; d=json.load(open('scan-results.json')); assert d['persistence']['stored'] is True, d.get('persistence'); print('Production scan persisted:', d['scanned'])"
          fi
          curl --location --fail --silent --show-error --retry 2 --max-time 30 \
            "https://liquidity-nexus-api-agus-902e.vercel.app/api/v1/signals?limit=1" -o persisted-signals.json
          python -c "import json; d=json.load(open('persisted-signals.json')); assert d['count'] >= 1, d; print('Persistent history readback passed')"
  android:
    if: github.event_name != 'schedule'
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - name: Build static web app
        env:
          NEXT_PUBLIC_API_URL: https://liquidity-nexus-api-agus-902e.vercel.app
        run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK signature and alignment
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-nexus-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
      - name: Publish latest APK for direct download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: LIQUIDITY NEXUS Android APK (latest)
          target_commitish: main
          prerelease: true
          overwrite_files: true
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  scheduled-scan:
    name: Scheduled live market scan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production ICT scan
        run: |
          curl --location --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 120 \
            -X POST "https://liquidity-nexus-api-agus-902e.vercel.app/api/v1/scan" \
            -H "Content-Type: application/json" \
            -d '{"symbols":["EURUSD","GBPUSD","USDJPY","XAUUSD","AUDUSD","USDCAD"],"timeframe":"15M"}' \
            -o scan-results.json
          cat scan-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-ict-scan-results
          path: scan-results.json
          retention-days: 7
