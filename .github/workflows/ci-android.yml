name: Liquidity Nexus CI, Production Scan & Android Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: liquidity-nexus-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'workflow_dispatch' && 'manual' || github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}
  # Historical data downloads and production acceptance must finish; queue newer pushes instead of canceling active work.
  cancel-in-progress: false

jobs:
  backend:
    if: github.event_name != 'schedule'
    name: Backend validation and production acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Backend unit smoke tests
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          health = client.get("/health")
          assert health.status_code == 200, health.text
          assert health.json()["mode"] == "SIGNAL_ONLY"
          instruments = client.get("/api/v1/instruments")
          assert instruments.status_code == 200
          assert instruments.json()["total"] >= 20
          assert client.get("/api/v1/status").status_code == 200
          print("Backend API smoke tests passed")
          PY
      - name: Market-data quality and ICT engine unit tests
        run: python -m pytest -q tests/test_market_data_and_ict.py
      - name: Walk-forward backtest on licensed historical market candles
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          if not os.getenv("TWELVE_DATA_API_KEY"):
              result = {
                  "status": "SKIPPED",
                  "reason": "TWELVE_DATA_API_KEY is not configured in GitHub Actions; Yahoo data is not used for trading backtests.",
              }
              with open("historical-backtest.json", "w") as f:
                  json.dump(result, f, indent=2)
              print(result)
              raise SystemExit(0)
          from app.engines.backtest import run_backtest
          reports = []
          for symbol in ("EURUSD", "XAUUSD"):
              report = run_backtest(symbol, timeframe="15M", limit=2000, step=20, window_size=200)
              payload = report.to_dict()
              assert payload["bars_used"] >= 210, payload
              assert payload["period_start"] and payload["period_end"], payload
              assert payload["data_provider"] not in ("unavailable", "SyntheticDataProvider"), payload
              reports.append(payload)
              print(json.dumps({
                  "symbol": symbol, "provider": payload["data_provider"],
                  "bars": payload["bars_used"], "period_start": payload["period_start"],
                  "period_end": payload["period_end"], "trades": payload["total"],
                  "wins": payload["wins"], "losses": payload["losses"],
                  "win_rate": payload["win_rate"], "net_r": payload["net_r"],
                  "profit_factor": payload["profit_factor"],
              }, sort_keys=True))
          with open("historical-backtest.json", "w") as f:
              json.dump(reports, f, indent=2)
          PY
      - name: Upload historical backtest report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ict-historical-backtest-${{ github.run_number }}
          path: backend/historical-backtest.json
          if-no-files-found: error
      - name: Production market-data and persistent-history acceptance
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          BASE="https://liquidity-nexus-api-agus-902e.vercel.app"
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --max-time 30 "$BASE/health" -o health.json
          curl --fail --silent --show-error --max-time 30 "$BASE/api/v1/storage/health" -o storage.json
          curl --fail --silent --show-error --max-time 30 "$BASE/api/v1/status" -o status.json
          python - <<'PY'
          import json, os, subprocess
          health=json.load(open("health.json"))
          storage=json.load(open("storage.json"))
          status=json.load(open("status.json"))
          assert health.get("status") == "ok", health
          assert storage.get("available") is True, storage
          deployed=status.get("git_commit")
          expected=os.getenv("GITHUB_SHA")
          assert deployed and expected, {"deployed_commit":deployed,"expected_commit":expected}
          if deployed != expected:
              subprocess.run(["git", "fetch", "--no-tags", "origin", deployed, "--depth=1"], cwd="..", check=True)
              diff=subprocess.run(["git", "diff", "--quiet", deployed, expected, "--", "backend/app", "backend/requirements.txt"], cwd="..")
              assert diff.returncode == 0, {
                  "deployed_commit": deployed, "workflow_commit": expected,
                  "reason": "backend application or dependencies changed after the deployed revision",
              }
          print("Production health, Blob storage and deployed backend source compatibility passed:", deployed, "workflow:", expected)
          PY
          for symbol in EURUSD XAUUSD; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 45 "$BASE/api/v1/ohlc/$symbol?timeframe=15M&limit=100" -o "$symbol.json"
            python - "$symbol.json" "$symbol" <<'PY'
          import json,sys,os
          d=json.load(open(sys.argv[1]))
          assert d.get("symbol") == sys.argv[2], d
          q=d.get("quality",{})
          assert q.get("provider"), q
          if d.get("candles"):
              assert len(d["candles"]) >= 10, (sys.argv[2], q)
              assert q.get("last_timestamp"), q
              assert "TwelveDataProvider" in q.get("provider", ""), q
              print(sys.argv[2], "candles:", len(d["candles"]), "stale:", q.get("stale"), "provider:", q.get("provider"))
          else:
              assert not q.get("is_valid"), q
              assert q.get("market_status") == "unavailable", q
              if os.getenv("TWELVE_DATA_API_KEY"):
                  raise AssertionError(f"GitHub Actions key exists but production {sys.argv[2]} has no licensed candles: {q}")
              print(sys.argv[2], "has no licensed feed; no candles/signals permitted:", q.get("message"))
          PY
          done
          curl --fail --silent --show-error --max-time 30 "$BASE/api/v1/signals?limit=500" -o history-before.json
          python - <<'PY'
          import json
          d=json.load(open("history-before.json"))
          assert "signals" in d and "count" in d, d
          print("Existing history records:", d["count"])
          PY
          for pass in 1 2; do
            curl --fail --silent --show-error --max-time 180 -X POST "$BASE/api/v1/scan" \
              -H "Content-Type: application/json" \
              -d '{"symbols":["EURUSD","XAUUSD"],"timeframe":"15M"}' -o "scan-$pass.json"
            python - "scan-$pass.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("status") == "completed", d
          assert d.get("scanned") == 2, d
          assert d.get("persistence",{}).get("stored") is True, d.get("persistence")
          for item in d.get("results",[]):
              assert item.get("data_quality") is not None, item
          print("Production scan pass persisted:", d.get("scanned"), "results; confirmed:", d.get("confirmed"))
          PY
          done
          curl --fail --silent --show-error --max-time 30 "$BASE/api/v1/signals?limit=500" -o history-after.json
          python - <<'PY'
          import json
          before=json.load(open("history-before.json"))
          after=json.load(open("history-after.json"))
          assert after.get("count",0) >= before.get("count",0)+2, {"before":before.get("count"),"after":after.get("count")}
          print("Blob history readback after two subsequent scans passed:", after["count"])
          PY

  android-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: Build and verify signed Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Build production web app for Android
        env:
          NEXT_PUBLIC_API_URL: https://liquidity-nexus-api-agus-902e.vercel.app
        run: |
          set -euo pipefail
          npm run build
          test -d out
          grep -R --fixed-strings "https://liquidity-nexus-api-agus-902e.vercel.app" out >/dev/null
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set explicit Android package version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"(?m)^\s*versionCode\s+\d+", "        versionCode 1", text, count=1)
          text, name_count = re.subn(r"""(?m)^\s*versionName\s+["'][^"']+["']""", '        versionName "1.0.0"', text, count=1)
          assert code_count == 1 and name_count == 1, "Could not set Android versionCode/versionName"
          path.write_text(text)
          print("Android package version set to 1.0.0 (versionCode 1)")
          PY
      - name: Build Android release variant
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Require persistent release-signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64" || { echo "::error::Missing repository secret ANDROID_SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing repository secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing repository secret ANDROID_KEY_PASSWORD"; exit 1; }
      - name: Sign, verify package metadata and integrity
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/liquidity-nexus-release.jks"
          test -s "$UNSIGNED"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$RUNNER_TEMP/liquidity-nexus-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/LIQUIDITY-NEXUS-release.apk" "$RUNNER_TEMP/liquidity-nexus-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/LIQUIDITY-NEXUS-release.apk"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$RUNNER_TEMP/LIQUIDITY-NEXUS-release.apk"
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/LIQUIDITY-NEXUS-release.apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.liquiditynexus.app' versionCode='1' versionName='1.0.0'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "application-label:'LIQUIDITY NEXUS'" "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$RUNNER_TEMP/LIQUIDITY-NEXUS-release.apk" | tee "$RUNNER_TEMP/apk-sha256.txt"
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: liquidity-nexus-signed-release-apk
          path: ${{ runner.temp }}/LIQUIDITY-NEXUS-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove legacy debug APK from latest release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-latest app-debug.apk --yes || true
      - name: Publish signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'android-latest' || github.ref_name }}
          name: LIQUIDITY NEXUS Android Release APK
          target_commitish: main
          prerelease: true
          overwrite_files: true
          files: ${{ runner.temp }}/LIQUIDITY-NEXUS-release.apk

  scheduled-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Execute and verify 20-minute production scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify main branch schedule context
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Scheduled/manual production scans must run from main"; exit 1; }
      - name: Verify deployed backend revision before scanning
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "https://liquidity-nexus-api-agus-902e.vercel.app/api/v1/status" -o backend-status.json
          python - <<'PY'
          import json, os, subprocess
          status=json.load(open("backend-status.json"))
          deployed=status.get("git_commit")
          expected=os.environ["EXPECTED_SHA"]
          assert deployed and expected, {"deployed_commit":deployed,"expected_commit":expected}
          if deployed != expected:
              subprocess.run(["git", "fetch", "--no-tags", "origin", deployed, "--depth=1"], check=True)
              diff=subprocess.run(["git", "diff", "--quiet", deployed, expected, "--", "backend/app", "backend/requirements.txt"])
              assert diff.returncode == 0, {
                  "deployed_commit": deployed, "expected_commit": expected,
                  "reason": "backend application or dependencies changed after the deployed revision",
              }
          print("Scanning deployed backend application revision:", deployed, "workflow:", expected)
          PY
      - name: Run production ICT scan and verify persistence
        run: |
          set -euo pipefail
          BASE="https://liquidity-nexus-api-agus-902e.vercel.app"
          success=0
          for attempt in 1 2 3; do
            echo "Production scan attempt $attempt/3"
            if curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 180 \
              -X POST "$BASE/api/v1/scan" \
              -H "Content-Type: application/json" \
              -d '{"symbols":["EURUSD","GBPUSD","USDJPY","XAUUSD","AUDUSD","USDCAD"],"timeframe":"15M"}' \
              -o scan-results.json; then
              if python - <<'PY'
          import json
          d=json.load(open("scan-results.json"))
          assert d.get("status") == "completed", d
          assert d.get("scanned") == 6, d
          assert d.get("persistence",{}).get("stored") is True, d.get("persistence")
          for result in d.get("results", []):
              quality = result.get("data_quality") or {}
              assert quality.get("provider"), result
              if (not quality.get("is_valid") or quality.get("stale")
                      or quality.get("market_status") == "market_closed"):
                  assert result.get("setup_status") == "NO_SETUP", result
                  assert not result.get("best_setup"), result
              if result.get("symbol") == "XAUUSD" and "GC=F" in quality.get("provider", ""):
                  assert "futures proxy" in quality.get("provider", "").lower(), quality
          print("Scan persisted:", d.get("scanned"), "symbols; confirmed:", d.get("confirmed"))
          PY
              then
                if curl --fail --silent --show-error --retry 2 --max-time 40 "$BASE/api/v1/signals?limit=500" -o history.json &&
                   python - <<'PY'
          import json
          d=json.load(open("history.json"))
          assert d.get("count",0) >= 1, d
          print("Persistent history available:", d["count"], "records")
          PY
                then
                  success=1
                  break
                fi
              fi
            fi
            echo "::warning::Production scan acceptance failed on attempt $attempt; retrying after 15 seconds"
            sleep 15
          done
          test "$success" -eq 1 || { echo "::error::Production scan failed after 3 attempts"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-ict-scan-results
          path: scan-results.json
          retention-days: 7

  dukascopy-historical-research:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    name: ICT walk-forward backtest on Dukascopy historical data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend analysis dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Download one year of legitimate spot and FX bid candles
        run: |
          set -euo pipefail
          npx --yes dukascopy-node -i eurusd -from 2025-11-01 -to 2026-11-01 -t m15 -f csv -v
          npx --yes dukascopy-node -i xauusd -from 2025-11-01 -to 2026-11-01 -t m15 -f csv -v
          EUR_CSV="$(find download -type f -iname '*eurusd*m15*bid*.csv' | head -n 1)"
          XAU_CSV="$(find download -type f -iname '*xauusd*m15*bid*.csv' | head -n 1)"
          test -s "$EUR_CSV"
          test -s "$XAU_CSV"
          printf 'EURUSD dataset: %s\nXAUUSD dataset: %s\n' "$EUR_CSV" "$XAU_CSV"
          echo "EUR_CSV=$EUR_CSV" >> "$GITHUB_ENV"
          echo "XAU_CSV=$XAU_CSV" >> "$GITHUB_ENV"
      - name: Run walk-forward ICT backtests and data-quality checks
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/run_dukascopy_backtest.py --csv "../$EUR_CSV" --symbol EURUSD --timeframe 15M --output reports/eurusd-dukascopy-backtest.json
          python scripts/run_dukascopy_backtest.py --csv "../$XAU_CSV" --symbol XAUUSD --timeframe 15M --output reports/xauusd-dukascopy-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("reports").glob("*-dukascopy-backtest.json"):
              result=json.loads(path.read_text())
              assert result["bars_used"] >= 210, result
              assert result["data_provider"].startswith("Dukascopy"), result
              assert result["period_start"] and result["period_end"], result
              print(path.name, "bars=", result["bars_used"], "trades=", result["total"],
                    "win_rate=", result["win_rate"], "net_R=", result["net_r"],
                    "profit_factor=", result["profit_factor"],
                    "max_drawdown_R=", result["max_drawdown_r"],
                    "session_breaks=", result["session_breaks"],
                    "missing_candles=", result["missing_candles"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ict-dukascopy-historical-backtests
          path: |
            backend/reports/*-dukascopy-backtest.json
            download/*eurusd*m15*bid*.csv
            download/*xauusd*m15*bid*.csv
          if-no-files-found: error
          retention-days: 30

